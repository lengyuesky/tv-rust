name: 检查与原生双架构镜像发布

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 格式、Rust 测试与网页构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 使用 runner 原生工具及全部 CPU
        run: |
          nproc
          free -h
          for tool in cc c++ cmake pkg-config; do command -v "$tool"; done
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffprobe
          key: ffprobe-linux-x64-btbn-8.1.3-493e89a48da0
      - name: 准备固定版本 FFprobe
        timeout-minutes: 2
        run: bash scripts/prepare-ci-ffprobe.sh
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 检查发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"
          web_version=$(node -p "require('./web/package.json').version")
          test "$web_version" = "$version"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --jobs "$(nproc)" -- -D warnings
      - run: cargo test --locked --jobs "$(nproc)"
      - run: npm ci && npm test && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  docker:
    name: 原生构建 ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/
      - name: 核对 runner 资源与架构
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          nproc
          free -h
          uname -m
          test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
      - name: 镜像名称
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 一次构建并导出镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-contexts: web-output=./web/dist
          labels: |
            org.opencontainers.image.title=TV Rust
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          outputs: |
            type=docker,name=tv-rust-ci:${{ matrix.arch }}
            ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || '' }}
          cache-from: type=gha,scope=tv-rust-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tv-rust-${{ matrix.arch }},ignore-error=true,timeout=3m
      - name: 验证镜像架构、空启动与网页
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          TEST_IMAGE: tv-rust-ci:${{ matrix.arch }}
        run: bash scripts/smoke-image.sh
      - name: 保存镜像摘要
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: 合并并验证双架构镜像
    needs: docker
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 镜像名称
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: 合并架构并发布标签
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          digests=("$RUNNER_TEMP"/digests/*)
          test "${#digests[@]}" -eq 2
          for file in "${digests[@]}"; do
            digest=$(basename "$file")
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            args+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}" --raw \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          {
            echo '### 已发布双架构镜像'
            echo
            printf -- '- `%s`\n' "${tags[@]}"
            echo
            echo 'AMD64 与 ARM64 各用免费标准 runner 的 4 核、16 GB 内存并行原生构建；网页构建一次，单架构镜像构建一次，通过启动检查后发布标签。'
          } >> "$GITHUB_STEP_SUMMARY"

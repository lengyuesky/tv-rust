[package]
name = "tv-rust"
version = "0.1.0"
edition = "2024"
description = "Rust 影视聚合服务，支持配置订阅、网页播放与飞牛播放器"
license = "MIT"
repository = "https://github.com/lengyuesky/tv-rust"

[dependencies]
anyhow = "1"
argon2 = "0.6"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
bs58 = "0.5"
bytes = "1"
futures-util = "0.3"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
